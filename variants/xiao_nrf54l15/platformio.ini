; Seeed XIAO nRF54L15 with the Wio-SX1262 LoRa board (same pins as the xiao_nrf52 variant).
; D4/D5 (normally I2C) are the radio's NSS and RXEN, and D6/D7 are the USB bridge UART,
; so there is no I2C bus for sensors or an RTC. Memory map (every env, so a LoRa OTA update between
; envs never moves InternalFS): arch/nrf54l/ldscripts/xiao_nrf54l15_bootloader.ld.
[Xiao_nrf54l15]
extends = nrf54_base
board = seeed-xiao-nrf54l15
build_flags = ${nrf54_base.build_flags}
  -I variants/xiao_nrf54l15
  -D XIAO_NRF54L15
  -D LFS_RRAM_BASE=0x118000
  -D LFS_RRAM_SIZE=0x2F000
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=PIN_LED_BUILTIN
  ; defining SCLK makes std_init() call SPI.begin() with these pins
  -D P_LORA_SCLK=PIN_D8
  -D P_LORA_MISO=PIN_D9
  -D P_LORA_MOSI=PIN_D10
  -D P_LORA_DIO_1=PIN_D1
  -D P_LORA_RESET=PIN_D2
  -D P_LORA_BUSY=PIN_D3
  -D P_LORA_NSS=PIN_D4
  -D SX126X_RXEN=PIN_D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${nrf54_base.build_src_filter}
  +<../variants/xiao_nrf54l15>
lib_deps = ${nrf54_base.lib_deps}
  ; provides the board's VBAT sampling (nrf54l15_hal.h)
  Nrf54L15-Clean-Implementation

[env:Xiao_nrf54l15_repeater]
extends = Xiao_nrf54l15
build_flags =
  ${Xiao_nrf54l15.build_flags}
  -D ADVERT_NAME='"Xiao_nrf54l15 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf54l15.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:Xiao_nrf54l15_room_server]
extends = Xiao_nrf54l15
build_flags =
  ${Xiao_nrf54l15.build_flags}
  -D ADVERT_NAME='"Xiao_nrf54l15 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf54l15.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:Xiao_nrf54l15_companion_radio_ble]
extends = Xiao_nrf54l15
build_flags =
  ${Xiao_nrf54l15.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf54l15.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf54l15.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_nrf54l15_companion_radio_usb]
extends = Xiao_nrf54l15
build_flags =
  ${Xiao_nrf54l15.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf54l15.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf54l15.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_nrf54l15_kiss_modem]
extends = Xiao_nrf54l15
build_src_filter = ${Xiao_nrf54l15.build_src_filter}
  +<../examples/kiss_modem/*.cpp>

; + firmware over LoRa (tools/lora-ota/README.md): staged in the RRAM slot above the app and
; installed by swapping the two (src/helpers/LoraOTANrf54.cpp)
[env:Xiao_nrf54l15_companion_radio_ble_lora_ota]
extends = env:Xiao_nrf54l15_companion_radio_ble
build_flags =
  ${env:Xiao_nrf54l15_companion_radio_ble.build_flags}
  -D LORA_OTA_BOARD='"xiao_nrf54l15_companion_ble"'
  -D LORA_OTA_PUBKEY='"07e6a48ce3536bcc11d8f423e1237121d05731ec4608ff7702d6c66f17c1ae5f"'

[env:Xiao_nrf54l15_repeater_lora_ota]
extends = env:Xiao_nrf54l15_repeater
build_flags =
  ${env:Xiao_nrf54l15_repeater.build_flags}
  -D LORA_OTA_BOARD='"xiao_nrf54l15_repeater"'
  -D LORA_OTA_PUBKEY='"07e6a48ce3536bcc11d8f423e1237121d05731ec4608ff7702d6c66f17c1ae5f"'

[env:Xiao_nrf54l15_room_server_lora_ota]
extends = env:Xiao_nrf54l15_room_server
build_flags =
  ${env:Xiao_nrf54l15_room_server.build_flags}
  -D LORA_OTA_BOARD='"xiao_nrf54l15_room_server"'
  -D LORA_OTA_PUBKEY='"07e6a48ce3536bcc11d8f423e1237121d05731ec4608ff7702d6c66f17c1ae5f"'

; Hardware test of the LoRa OTA platform without a radio (examples/nrf54_ota_selftest): two
; builds that differ only in their tag, so a swap between them is visible
[Xiao_nrf54l15_ota_selftest]
extends = Xiao_nrf54l15
build_flags =
  ${Xiao_nrf54l15.build_flags}
  ${Xiao_nrf54l15_radio2.build_flags}
  -D LORA_OTA_BOARD='"xiao_nrf54l15_selftest"'
  -D LORA_OTA_PUBKEY='"07e6a48ce3536bcc11d8f423e1237121d05731ec4608ff7702d6c66f17c1ae5f"'
build_src_filter = ${Xiao_nrf54l15.build_src_filter}
  +<../examples/nrf54_ota_selftest/*.cpp>

[env:Xiao_nrf54l15_ota_selftest_a]
extends = Xiao_nrf54l15_ota_selftest
build_flags = ${Xiao_nrf54l15_ota_selftest.build_flags}
  -D SELFTEST_TAG='"A"'

[env:Xiao_nrf54l15_ota_selftest_b]
extends = Xiao_nrf54l15_ota_selftest
build_flags = ${Xiao_nrf54l15_ota_selftest.build_flags}
  -D SELFTEST_TAG='"B-second-image"'

; A second SX1262 (lora2) on the spare pins, sharing SPI (D8-D10) with lora1. Which radio
; carries MeshCore and which is the app's aux radio is a runtime setting, the `radio` CLI
; command (RadioRoles.h). DIO1 MUST be on a P0/P1 pin (D0-D5, D11, D12): the core's
; attachInterrupt() silently does nothing on P2 (D6-D10, D13-D15), so a DIO1 there never
; reports a packet. D6/D7 stay free for a GPS UART (Serial1); D11 is avoided: the silicon
; hard-wires it to the GRTC PWM output.
; Give lora2 its own 3.3 V supply if both may transmit at full power: the XIAO's regulator
; browns out on two 22 dBm TXs.
[Xiao_nrf54l15_radio2]
build_flags =
  -D P_LORA2_NSS=PIN_D0
  -D P_LORA2_DIO_1=PIN_D12
  -D P_LORA2_BUSY=PIN_D13
  -D P_LORA2_RXEN=PIN_D14
  -D P_LORA2_RESET=PIN_D15

[env:Xiao_nrf54l15_companion_radio_ble_lora_ota_radio2]
extends = env:Xiao_nrf54l15_companion_radio_ble_lora_ota
build_flags =
  ${env:Xiao_nrf54l15_companion_radio_ble_lora_ota.build_flags}
  ${Xiao_nrf54l15_radio2.build_flags}
